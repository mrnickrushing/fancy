name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fancy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fancy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build generated site
        run: npm run build:site
      - name: Check operational scripts
        run: bash -n scripts/backup_db.sh scripts/production_smoke.sh
      - name: Run tests
        run: npm test -- --test-concurrency=1
        env:
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/fancy
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
